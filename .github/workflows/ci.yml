name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Smoke test (offline demo + CLI)
        run: |
          node dist/src/cli.js demo
          node dist/src/cli.js add "CI prefers green builds" --file ci.memory.json
          node dist/src/cli.js recall "green builds" --file ci.memory.json
          node dist/examples/basic.js
